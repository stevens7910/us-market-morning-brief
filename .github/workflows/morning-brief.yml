name: Morning Brief — Generate & Deploy

on:
  schedule:
    # Každý pracovní den (Po–Pá) v 05:30 UTC (06:30 CET v zimě / 07:30 CEST v létě)
    - cron: '30 5 * * 1-5'
  workflow_dispatch:
    inputs:
      edition_date:
        description: 'Volitelné datum vydání (YYYY-MM-DD), prázdné = dnešní datum v Praze'
        required: false
        default: ''
      skip_generation:
        description: 'Přeskočit generování AI vydání a pouze přebuildovat a nasadit PWA'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: morning-brief-pages
  cancel-in-progress: false

jobs:
  generate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        if: ${{ !inputs.skip_generation }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'pipeline/requirements.txt'

      - name: Install Python pipeline dependencies
        if: ${{ !inputs.skip_generation }}
        run: pip install -r pipeline/requirements.txt

      - name: Generate daily US Market Morning Brief edition
        if: ${{ !inputs.skip_generation }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          if [ -n "${{ inputs.edition_date }}" ]; then
            python pipeline/generate_brief.py --date "${{ inputs.edition_date }}"
          else
            python pipeline/generate_brief.py
          fi

      - name: Commit and push generated edition data
        if: ${{ !inputs.skip_generation }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/index.json public/data/editions/
          if git diff --staged --quiet; then
            echo "Žádné změny v public/data/ ke commitu."
          else
            git commit -m "chore(edition): ranní vydání $(date -u +%Y-%m-%d) [skip ci]"
            git push
          fi

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build static PWA
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: generate-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
